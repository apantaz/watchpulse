version: 2

models:
  - name: dim_provider
    description: "{{ doc('dim_provider') }}"
    meta:
      owner: watchpulse
      grain: one row per provider_key
    columns:
      - name: provider_key
        description: "{{ doc('col_provider_key') }}"
        data_type: varchar
        tests: [not_null, unique]
      - name: provider_name
        description: "{{ doc('col_provider_name') }}"
        data_type: varchar
        tests: [not_null, unique]
      - name: is_active
        description: "{{ doc('col_provider_is_active') }}"
        data_type: boolean
        tests: [not_null]

  - name: catalog_availability
    description: "{{ doc('catalog_availability') }}"
    meta:
      owner: watchpulse
      grain: one row per content, region, provider, and monetization type
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [tmdb_id, content_type, region, provider_key, monetization_type]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_available <> is_upcoming"
    columns:
      - name: tmdb_id
        description: "{{ doc('col_tmdb_id') }}"
        data_type: bigint
        tests: [not_null]
      - name: content_type
        description: "{{ doc('col_content_type') }}"
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [movie, tv]
      - name: title
        description: "{{ doc('col_title') }}"
        data_type: varchar
        tests: [not_null]
      - name: original_title
        description: "{{ doc('col_original_title') }}"
        data_type: varchar
      - name: overview
        description: "{{ doc('col_overview') }}"
        data_type: varchar
      - name: release_date
        description: "{{ doc('col_release_date') }}"
        data_type: date
      - name: release_year
        description: "{{ doc('col_release_year') }}"
        data_type: integer
      - name: runtime_minutes
        description: "{{ doc('col_runtime_minutes') }}"
        data_type: integer
      - name: original_language
        description: "{{ doc('col_original_language') }}"
        data_type: varchar
      - name: genre_ids
        description: "{{ doc('col_genre_ids') }}"
        data_type: json
      - name: tmdb_rating
        description: "{{ doc('col_tmdb_rating') }}"
        data_type: double
      - name: vote_count
        description: "{{ doc('col_vote_count') }}"
        data_type: bigint
      - name: popularity_score
        description: "{{ doc('col_popularity_score') }}"
        data_type: double
      - name: region
        description: "{{ doc('col_region') }}"
        data_type: varchar
        tests: [not_null]
      - name: provider_key
        description: "{{ doc('col_provider_key') }}"
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_key
      - name: provider_name
        description: "{{ doc('col_provider_name') }}"
        data_type: varchar
        tests: [not_null]
      - name: monetization_type
        description: "{{ doc('col_monetization_type') }}"
        data_type: varchar
        tests: [not_null]
      - name: available_since
        description: "{{ doc('col_available_since') }}"
        data_type: timestamptz
      - name: available_from
        description: "{{ doc('col_available_from') }}"
        data_type: timestamptz
      - name: expires_on
        description: "{{ doc('col_expires_on') }}"
        data_type: timestamptz
      - name: is_available
        description: "{{ doc('col_is_available') }}"
        data_type: boolean
        tests: [not_null]
      - name: is_upcoming
        description: "{{ doc('col_is_upcoming') }}"
        data_type: boolean
        tests: [not_null]
      - name: poster_path
        description: "{{ doc('col_poster_path') }}"
        data_type: varchar
      - name: backdrop_path
        description: "{{ doc('col_backdrop_path') }}"
        data_type: varchar
      - name: metadata_source
        description: "{{ doc('col_metadata_source') }}"
        data_type: varchar
        tests: [not_null]
      - name: availability_source
        description: "{{ doc('col_availability_source') }}"
        data_type: varchar
        tests: [not_null]
      - name: last_updated_at
        description: "{{ doc('col_last_updated_at') }}"
        data_type: timestamptz
        tests: [not_null]
