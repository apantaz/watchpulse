version: 2

models:
  - name: stg_tmdb_discovery_snapshots
    description: Complete and partial TMDB discovery-query manifests used to select live snapshots.
    meta:
      owner: watchpulse
      source: tmdb
      grain: one row per run, region, provider, and content type
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [run_id, region, provider_key, content_type]
    columns:
      - {name: run_id, description: Ingestion run identifier., data_type: varchar, tests: [not_null]}
      - {name: completed_at, description: Time the discovery manifest was retained., data_type: timestamptz, tests: [not_null]}
      - {name: region, description: "{{ doc('col_region') }}", data_type: varchar, tests: [not_null]}
      - {name: provider_key, description: "{{ doc('col_provider_key') }}", data_type: varchar, tests: [not_null]}
      - name: content_type
        description: "{{ doc('col_content_type') }}"
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [movie, tv]
      - {name: upstream_total_pages, description: Pages reported by TMDB., data_type: integer, tests: [not_null]}
      - {name: expected_pages, description: Pages required within the source ceiling., data_type: integer, tests: [not_null]}
      - {name: pages_fetched, description: Pages retained by WatchPulse., data_type: integer, tests: [not_null]}
      - {name: total_results, description: Results reported by TMDB., data_type: integer, tests: [not_null]}
      - {name: is_complete, description: Whether all expected pages were retained., data_type: boolean, tests: [not_null]}
      - {name: truncated_by_source_limit, description: Whether the TMDB 500-page ceiling prevented completeness., data_type: boolean, tests: [not_null]}

  - name: stg_tmdb_watch_providers
    description: "{{ doc('stg_tmdb_watch_providers') }}"
    meta:
      owner: watchpulse
      source: tmdb
      grain: one row per content, region, provider, and monetization type
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tmdb_id, content_type, region, provider_key, monetization_type]
    columns:
      - {name: tmdb_id, description: "{{ doc('col_tmdb_id') }}", data_type: bigint, tests: [not_null]}
      - {name: content_type, description: "{{ doc('col_content_type') }}", data_type: varchar, tests: [not_null]}
      - {name: region, description: "{{ doc('col_region') }}", data_type: varchar, tests: [not_null]}
      - {name: provider_key, description: "{{ doc('col_provider_key') }}", data_type: varchar, tests: [not_null]}
      - {name: monetization_type, description: "{{ doc('col_monetization_type') }}", data_type: varchar, tests: [not_null]}
      - {name: source_updated_at, description: "{{ doc('col_source_updated_at') }}", data_type: timestamptz, tests: [not_null]}
      - {name: source_file, description: "{{ doc('col_source_file') }}", data_type: varchar, tests: [not_null]}

  - name: stg_tmdb_metadata
    description: "{{ doc('stg_tmdb_metadata') }}"
    meta:
      owner: watchpulse
      source: tmdb
      grain: one row per tmdb_id and content_type
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tmdb_id, content_type]
    columns:
      - {name: tmdb_id, description: "{{ doc('col_tmdb_id') }}", data_type: bigint, tests: [not_null]}
      - name: content_type
        description: "{{ doc('col_content_type') }}"
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [movie, tv]
      - {name: title, description: "{{ doc('col_title') }}", data_type: varchar, tests: [not_null]}
      - {name: original_title, description: "{{ doc('col_original_title') }}", data_type: varchar}
      - {name: overview, description: "{{ doc('col_overview') }}", data_type: varchar}
      - {name: release_date, description: "{{ doc('col_release_date') }}", data_type: date}
      - {name: runtime_minutes, description: "{{ doc('col_runtime_minutes') }}", data_type: integer}
      - {name: episode_count, description: "{{ doc('col_episode_count') }}", data_type: integer}
      - {name: season_count, description: "{{ doc('col_season_count') }}", data_type: integer}
      - {name: genre_ids, description: "{{ doc('col_genre_ids') }}", data_type: json}
      - {name: original_language, description: "{{ doc('col_original_language') }}", data_type: varchar}
      - {name: tmdb_rating, description: "{{ doc('col_tmdb_rating') }}", data_type: double}
      - {name: vote_count, description: "{{ doc('col_vote_count') }}", data_type: bigint, tests: [not_null]}
      - {name: tmdb_popularity, description: "{{ doc('col_tmdb_popularity') }}", data_type: double}
      - {name: poster_path, description: "{{ doc('col_poster_path') }}", data_type: varchar}
      - {name: backdrop_path, description: "{{ doc('col_backdrop_path') }}", data_type: varchar}
      - {name: source_updated_at, description: "{{ doc('col_source_updated_at') }}", data_type: timestamptz, tests: [not_null]}
      - {name: source_file, description: "{{ doc('col_source_file') }}", data_type: varchar, tests: [not_null]}

  - name: stg_streaming_links
    description: "{{ doc('stg_streaming_links') }}"
    meta:
      owner: watchpulse
      source: streaming_availability
      grain: one verified link per lifecycle event identity
    columns:
      - {name: tmdb_id, description: "{{ doc('col_tmdb_id') }}", data_type: bigint, tests: [not_null]}
      - {name: content_type, description: "{{ doc('col_content_type') }}", data_type: varchar, tests: [not_null]}
      - {name: region, description: "{{ doc('col_region') }}", data_type: varchar, tests: [not_null]}
      - {name: provider_key, description: "{{ doc('col_provider_key') }}", data_type: varchar, tests: [not_null]}
      - {name: monetization_type, description: "{{ doc('col_monetization_type') }}", data_type: varchar, tests: [not_null]}
      - {name: event_type, description: "{{ doc('col_event_type') }}", data_type: varchar, tests: [not_null]}
      - {name: event_date, description: "{{ doc('col_event_date') }}", data_type: timestamptz}
      - {name: watch_url, description: "{{ doc('col_watch_url') }}", data_type: varchar, tests: [not_null]}
      - {name: fetched_at, description: "{{ doc('col_fetched_at') }}", data_type: timestamptz, tests: [not_null]}

  - name: stg_tmdb_discovery
    description: "{{ doc('stg_tmdb_discovery') }}"
    meta:
      owner: watchpulse
      source: tmdb
      grain: one row per tmdb_id, content_type, region, and provider_key
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tmdb_id
              - content_type
              - region
              - provider_key
    columns:
      - name: tmdb_id
        description: "{{ doc('col_tmdb_id') }}"
        data_type: bigint
        tests: [not_null]
      - name: content_type
        description: "{{ doc('col_content_type') }}"
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [movie, tv]
      - name: region
        description: "{{ doc('col_region') }}"
        data_type: varchar
        tests: [not_null]
      - name: provider_key
        description: "{{ doc('col_provider_key') }}"
        data_type: varchar
        tests: [not_null]
      - name: title
        description: "{{ doc('col_title') }}"
        data_type: varchar
        tests: [not_null]
      - name: original_title
        description: "{{ doc('col_original_title') }}"
        data_type: varchar
      - name: overview
        description: "{{ doc('col_overview') }}"
        data_type: varchar
      - name: release_date
        description: "{{ doc('col_release_date') }}"
        data_type: date
      - name: genre_ids
        description: "{{ doc('col_genre_ids') }}"
        data_type: json
      - name: original_language
        description: "{{ doc('col_original_language') }}"
        data_type: varchar
      - name: tmdb_rating
        description: "{{ doc('col_tmdb_rating') }}"
        data_type: double
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 10
      - name: vote_count
        description: "{{ doc('col_vote_count') }}"
        data_type: bigint
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: tmdb_popularity
        description: "{{ doc('col_tmdb_popularity') }}"
        data_type: double
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: poster_path
        description: "{{ doc('col_poster_path') }}"
        data_type: varchar
      - name: backdrop_path
        description: "{{ doc('col_backdrop_path') }}"
        data_type: varchar
      - name: source_updated_at
        description: "{{ doc('col_source_updated_at') }}"
        data_type: timestamptz
        tests: [not_null]
      - name: source_file
        description: "{{ doc('col_source_file') }}"
        data_type: varchar

  - name: stg_streaming_events
    description: "{{ doc('stg_streaming_events') }}"
    meta:
      owner: watchpulse
      source: streaming_availability
      grain: one row per deterministic event_id
    columns:
      - name: event_id
        description: "{{ doc('col_event_id') }}"
        data_type: varchar
        tests: [not_null, unique]
      - name: tmdb_id
        description: "{{ doc('col_tmdb_id') }}"
        data_type: bigint
        tests: [not_null]
      - name: content_type
        description: "{{ doc('col_content_type') }}"
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [movie, tv]
      - name: region
        description: "{{ doc('col_region') }}"
        data_type: varchar
        tests: [not_null]
      - name: provider_key
        description: "{{ doc('col_provider_key') }}"
        data_type: varchar
        tests: [not_null]
      - name: monetization_type
        description: "{{ doc('col_monetization_type') }}"
        data_type: varchar
      - name: event_type
        description: "{{ doc('col_event_type') }}"
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [new, removed, updated, expiring, upcoming]
      - name: event_date
        description: "{{ doc('col_event_date') }}"
        data_type: timestamptz
      - name: available_from
        description: "{{ doc('col_available_from') }}"
        data_type: timestamptz
      - name: expires_on
        description: "{{ doc('col_expires_on') }}"
        data_type: timestamptz
      - name: source
        description: "{{ doc('col_source') }}"
        data_type: varchar
      - name: source_event_id
        description: "{{ doc('col_source_event_id') }}"
        data_type: varchar
      - name: ingested_at
        description: "{{ doc('col_ingested_at') }}"
        data_type: timestamptz
        tests: [not_null]
      - name: watch_url
        description: "{{ doc('col_watch_url') }}"
        data_type: varchar

  - name: stg_streaming_shows
    description: "{{ doc('stg_streaming_shows') }}"
    meta:
      owner: watchpulse
      source: streaming_availability
      grain: one row per tmdb_id and content_type
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tmdb_id, content_type]
    columns:
      - name: tmdb_id
        description: "{{ doc('col_tmdb_id') }}"
        data_type: bigint
        tests: [not_null]
      - name: content_type
        description: "{{ doc('col_content_type') }}"
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [movie, tv]
      - name: title
        description: "{{ doc('col_title') }}"
        data_type: varchar
        tests: [not_null]
      - name: original_title
        description: "{{ doc('col_original_title') }}"
        data_type: varchar
      - name: overview
        description: "{{ doc('col_overview') }}"
        data_type: varchar
      - name: release_year
        description: "{{ doc('col_release_year') }}"
        data_type: integer
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1800
                max_value: 2100
      - name: runtime_minutes
        description: "{{ doc('col_runtime_minutes') }}"
        data_type: integer
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 1440
      - name: source_genres
        description: "{{ doc('col_source_genres') }}"
        data_type: json
      - name: source_updated_at
        description: "{{ doc('col_source_updated_at') }}"
        data_type: timestamptz
        tests: [not_null]
      - name: source_file
        description: "{{ doc('col_source_file') }}"
        data_type: varchar
        tests: [not_null]
