name: Manual TMDB ingestion

on:
  workflow_dispatch:
    inputs:
      country:
        description: ISO alpha-2 region to ingest
        required: true
        default: GR
        type: string
      max_pages:
        description: Discovery pages per provider and content type
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: tmdb-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest TMDB raw data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      INGEST_COUNTRY: ${{ inputs.country }}
      INGEST_MAX_PAGES: ${{ inputs.max_pages }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secret
        run: |
          if [ -z "${TMDB_API_KEY}" ]; then
            echo "Repository secret TMDB_API_KEY is required." >&2
            exit 1
          fi

      - name: Validate inputs
        run: |
          if [[ ! "${INGEST_COUNTRY}" =~ ^[A-Za-z]{2}$ ]]; then
            echo "country must be a two-letter ISO code." >&2
            exit 1
          fi
          if [[ ! "${INGEST_MAX_PAGES}" =~ ^[1-9][0-9]*$ ]]; then
            echo "max_pages must be a positive integer." >&2
            exit 1
          fi

      - name: Run bounded ingestion
        run: python -m ingestion.run --country "${INGEST_COUNTRY}" --max-pages "${INGEST_MAX_PAGES}"

      - name: Upload raw lake artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-raw-${{ inputs.country }}-${{ github.run_id }}
          path: data/lake/raw/
          if-no-files-found: error
          retention-days: 7
