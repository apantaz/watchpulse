# DRAFT — not yet activated.
#
# This mirrors the "routine refresh" flow in docs/catalog-refresh-runbook.md:
# it runs `python -m ingestion.full_refresh` end to end (TMDB discovery,
# guarded first publish, streaming lifecycle, incremental enrichment, final
# publish). workflow_dispatch is the only trigger, so it never fires on its
# own — someone has to manually run it.

name: Routine catalog refresh (draft)

on:
  workflow_dispatch:
    inputs:
      country:
        description: ISO alpha-2 region to refresh
        required: true
        default: GR
        type: string

permissions:
  contents: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Guarded end-to-end catalog refresh
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      STREAMING_AVAILABILITY_API_KEY: ${{ secrets.STREAMING_AVAILABILITY_API_KEY }}
      INGEST_COUNTRY: ${{ inputs.country }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (runtime + warehouse/dbt)
        run: python -m pip install -e ".[warehouse]"

      - name: Validate required secrets
        run: |
          if [ -z "${TMDB_API_KEY}" ]; then
            echo "Repository secret TMDB_API_KEY is required." >&2
            exit 1
          fi
          if [ -z "${STREAMING_AVAILABILITY_API_KEY}" ]; then
            echo "Repository secret STREAMING_AVAILABILITY_API_KEY is required." >&2
            exit 1
          fi

      - name: Validate inputs
        run: |
          if [[ ! "${INGEST_COUNTRY}" =~ ^[A-Za-z]{2}$ ]]; then
            echo "country must be a two-letter ISO code." >&2
            exit 1
          fi

      - name: Install dbt packages
        working-directory: warehouse
        run: dbt deps

      - name: Run guarded catalog refresh
        run: >-
          python -m ingestion.full_refresh
          --country "${INGEST_COUNTRY}"
          --summary-output data/full-refresh-summary.json

      - name: Upload refresh output
        uses: actions/upload-artifact@v4
        with:
          name: catalog-refresh-${{ inputs.country }}-${{ github.run_id }}
          path: data/
          if-no-files-found: error
          retention-days: 14
