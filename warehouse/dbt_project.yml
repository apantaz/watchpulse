name: watchpulse
version: 0.3.0
config-version: 2

profile: watchpulse

model-paths: ["models"]
docs-paths: ["docs"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]

vars:
  "dbt_date:time_zone": "Europe/Athens"

clean-targets:
  - target
  - dbt_packages
  - logs

models:
  watchpulse:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
