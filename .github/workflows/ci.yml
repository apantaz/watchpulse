name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality, dbt, and Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,warehouse]"

      - name: Lint
        run: make lint

      - name: Test with coverage
        run: make coverage

      - name: Validate dbt foundation
        working-directory: warehouse
        env:
          WATCHPULSE_DBT_PATH: /tmp/watchpulse_ci.duckdb
        run: |
          dbt deps
          dbt debug
          dbt parse

  frontend:
    name: Frontend quality, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
