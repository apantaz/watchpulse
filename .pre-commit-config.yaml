default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
        stages: [pre-commit]

  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.7
    hooks:
      - id: dbt-compile
        args:
          - --global-flags
          - ++log-path
          - warehouse/logs
          - --models
          - path:models
          - --cmd-flags
          - ++project-dir
          - warehouse
          - ++profiles-dir
          - warehouse
          - ++target
          - pre_commit
        additional_dependencies:
          - dbt-duckdb>=1.11,<1.12
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: dbt-docs-generate
        args:
          - --global-flags
          - ++log-path
          - warehouse/logs
          - --cmd-flags
          - ++project-dir
          - warehouse
          - ++profiles-dir
          - warehouse
          - ++target
          - pre_commit
        additional_dependencies:
          - dbt-duckdb>=1.11,<1.12
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        stages: [pre-commit]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        stages: [pre-commit]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: pytest
        name: Offline test suite with coverage
        entry: make coverage
        language: system
        pass_filenames: false
        stages: [pre-push]
