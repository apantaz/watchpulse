name: Streaming lifecycle ingestion

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streaming-lifecycle-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Greece lifecycle changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STREAMING_AVAILABILITY_API_KEY: ${{ secrets.STREAMING_AVAILABILITY_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secret
        run: |
          if [ -z "${STREAMING_AVAILABILITY_API_KEY}" ]; then
            echo "Repository secret STREAMING_AVAILABILITY_API_KEY is required." >&2
            exit 1
          fi

      - name: Ingest one page per lifecycle type
        run: >-
          python -m ingestion.run_streaming_availability
          --country GR
          --max-requests 5
          --max-pages-per-type 1

      - name: Upload lifecycle data
        uses: actions/upload-artifact@v4
        with:
          name: streaming-lifecycle-${{ github.run_id }}
          path: data/
          if-no-files-found: error
          retention-days: 35
